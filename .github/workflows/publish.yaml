name: Publish Package

run-name: 'Publish package (`${{ inputs.package }}`)'

on:
  workflow_dispatch:
    inputs:
      package:
        description: Choose package to publish
        required: true
        type: choice
        options:
          - 'eslint-config-typescript'
          - 'eslint-config-typescript-next'
          - 'eslint-config-javascript-react'
          - 'eslint-config-typescript-react'
          - 'eslint-config-typescript-react-native'

permissions:
  id-token: write
  contents: read
          
jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
        
      - run: npm install -g npm@latest # npm >= 11.5.1
          
      - run: npm --prefix ${{ inputs.package }} publish --access public
          
